<figure class="github-contributions">
  <figcaption><a href="https://github.com/{{ site.github_username | escape }}?tab=overview">GitHub contributions</a></figcaption>
  <div class="github-calendar" tabindex="0" role="region" aria-label="GitHub contribution calendar. Scroll horizontally to explore the past year.">
    <img src="https://ghchart.rshah.org/043361/{{ site.github_username | escape }}" alt="{{ site.title | escape }}'s GitHub contributions over the past year" width="663" height="104" loading="lazy" decoding="async" referrerpolicy="no-referrer">
  </div>
  <p class="github-calendar-hint">Past year &middot; scroll to explore</p>
</figure>
